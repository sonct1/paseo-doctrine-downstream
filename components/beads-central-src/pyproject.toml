[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "beads-central"
version = "1.2.0"
description = "Thin centralized HTTP/MCP control plane for Beads, designed for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "httpx==0.28.1"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["beads_central*"]
exclude = ["tests*", "config*", "data*"]
