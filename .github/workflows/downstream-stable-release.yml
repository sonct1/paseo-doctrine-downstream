name: Downstream Stable Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Exact 40-character commit SHA already contained in main"
        required: true
        type: string
      tag:
        description: "paseo-v* annotated tag to create or validate and publish as stable/latest"
        required: true
        type: string

concurrency:
  group: downstream-stable-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create-tag:
    name: create-or-validate-stable-tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - name: Create or validate annotated release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Expected an exact 40-character source commit, got $SOURCE_REF" >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          case "$RELEASE_TAG" in
            paseo-v*) ;;
            *) echo "Expected paseo-v* tag, got $RELEASE_TAG" >&2; exit 1 ;;
          esac
          package_version=$(node -p "require('./package.json').version")
          test "${RELEASE_TAG#paseo-v}" = "$package_version"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_REF" refs/remotes/origin/main

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
            test "$(git rev-parse "$RELEASE_TAG^{}")" = "$SOURCE_REF"
          else
            git \
              -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$RELEASE_TAG" \
              -m "Paseo Foundation Downstream ${RELEASE_TAG#paseo-v} stable release"
            # GITHUB_TOKEN-authenticated pushes do not trigger recursive push workflows.
            git push origin "refs/tags/$RELEASE_TAG"
          fi

  stable:
    name: qualify-and-publish-stable
    needs: create-tag
    uses: ./.github/workflows/downstream-portable-release-core.yml
    with:
      source_ref: ${{ inputs.tag }}
      release_tag: ${{ inputs.tag }}
      publish: true
      prerelease: false
    permissions:
      contents: write
